<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Come si butta? - Esploratore dati</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">CSB</span>
        <div><strong>Come si butta?</strong><small>Esploratore dati</small></div>
      </div>
      <label class="field-label" for="municipality-search">Comuni acquisiti</label>
      <input id="municipality-search" class="side-search" type="search" placeholder="Filtra comuni">
      <nav id="municipality-list" class="municipality-list" aria-label="Comuni"></nav>
      <div id="batch-status" class="batch-status"></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Provincia di Grosseto</p>
          <h1 id="page-title">Esplorazione dati</h1>
        </div>
        <div class="global-search-wrap">
          <label class="sr-only" for="global-search">Cerca nei dati del comune</label>
          <input id="global-search" type="search" placeholder="Cerca EER, materiale, zona, indirizzo">
          <span id="search-count" class="search-count"></span>
        </div>
      </header>

      <nav id="view-tabs" class="tabs" aria-label="Viste dati"></nav>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="record-dialog" class="record-dialog">
    <div class="dialog-header">
      <div><p class="eyebrow">Record di acquisizione</p><h2 id="dialog-title"></h2></div>
      <button id="dialog-close" class="icon-button" type="button" title="Chiudi" aria-label="Chiudi">×</button>
    </div>
    <div id="dialog-content" class="dialog-content"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
