[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dove-lo-butto-data"
version = "0.1.0"
description = "Acquisition and normalization tools for Tuscan municipal waste data"
requires-python = ">=3.11"

[project.optional-dependencies]
vision = ["Pillow>=12,<13"]
training = ["Pillow>=12,<13", "torch>=2.13,<3", "torchvision>=0.28,<1"]

[project.scripts]
dove-lo-butto = "dovelobutto.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
